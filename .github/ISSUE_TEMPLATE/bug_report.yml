name: Bug report
description: Something in git-tui does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: message
    attributes:
      label: Message shown
      description: Any status bar or popup text, copied verbatim.
      render: text
  - type: input
    id: version
    attributes:
      label: git-tui version
      description: Shown at the bottom of the sidebar.
      placeholder: v3.2.0
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform and terminal
      placeholder: macOS 15, iTerm2
    validations:
      required: true
  - type: input
    id: gh
    attributes:
      label: gh version
      description: Output of `gh --version`.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I am on the latest release.
        - label: This report contains no tokens, webhook URLs or private ticket content.
          required: true
