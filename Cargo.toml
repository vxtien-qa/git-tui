[package]
name = "git-tui"
version = "3.2.0"
rust-version = "1.88.0"
edition = "2021"
default-run = "git-tui"
description = "Terminal UI for running QA on a GitHub Projects board"
authors = ["Tien Vu <vxtien.qa@gmail.com>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/vxtien-qa/git-tui"
homepage = "https://github.com/vxtien-qa/git-tui"
documentation = "https://github.com/vxtien-qa/git-tui/blob/master/docs/ARCHITECTURE.md"
keywords = ["tui", "github", "kanban", "qa", "cli"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["artifacts/", ".agent/", "docs/", "install.sh", "install.ps1"]

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
unicode-width = "0.2"
pulldown-cmark = "0.12"
arboard = "3"
open = "5"
ureq = { version = "3", features = ["json"] }

[profile.release]
lto = true
strip = true
opt-level = "z"
